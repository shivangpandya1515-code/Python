<!DOCTYPE html>
<html>

<head>
    <title>Student Management System</title>
</head>

<body>

    <h1>Student Management System</h1>

    <a href="{{ url_for('add') }}">
        Add Student
    </a>

    <br><br>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}

        <tr>

            <td>{{ student.id }}</td>

            <td>{{ student.name }}</td>

            <td>{{ student.email }}</td>

            <td>{{ student.course }}</td>

            <td>

                <a href="{{ url_for('edit', id=student.id) }}">
                    Edit
                </a>

                |

                <a href="{{ url_for('delete', id=student.id) }}"
                   onclick="return confirm('Are you sure you want to delete this student?')">
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
