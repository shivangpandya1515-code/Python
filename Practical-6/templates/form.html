<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .registration-card {
            max-width: 500px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm p-4 mx-auto registration-card">
            <h3 class="text-center mb-4">Student Registration</h3>
            <form action="/submit" method="POST">
                <div class="mb-3">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="course">Course</label>
                    <select class="form-select" id="course" name="course">
                        <option value="CSE">CSE</option>
                        <option value="IT">IT</option>
                        <option value="ECE">ECE</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Submit</button>
            </form>

            <hr class="my-4">

            <h5 class="text-center">Try GET Search</h5>
            <form action="/search" method="GET" class="d-flex">
                <input type="text" class="form-control me-2" name="query" placeholder="Search...">
                <button type="submit" class="btn btn-outline-secondary">Go</button>
            </form>
        </div>
    </div>
</body>
</html>
