<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm p-4 mx-auto col-12 col-md-6">
            <h3 class="text-center text-success mb-4">Registration Successful!</h3>
            <ul class="list-group">
                <li class="list-group-item"><strong>Name:</strong> {{ name }}</li>
                <li class="list-group-item"><strong>Email:</strong> {{ email }}</li>
                <li class="list-group-item"><strong>Course:</strong> {{ course }}</li>
            </ul>
            <a href="/" class="btn btn-secondary mt-4 w-100">Back to Form</a>
        </div>
    </div>
</body>
</html>
