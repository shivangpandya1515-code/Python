
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Student</title>
</head>
<body>
    <h1>Confirm Deletion</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ student.name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <p><a href="{% url 'student_list' %}">Cancel</a></p>
</body>
</html>
